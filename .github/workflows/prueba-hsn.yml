name: Prueba HSN
on: workflow_dispatch
permissions: {}
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar las fichas de HSN con curl
        shell: bash
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          for url in https://www.hsnstore.com/marcas/raw-series/creatina-monohidrato-en-polvo-200-mesh https://www.hsnstore.com/marcas/sport-series/evowhey-protein; do
            code=$(curl -s -o pagina.html -w '%{http_code}' --compressed --max-time 40 -A "$UA" -H 'Accept-Language: es-ES,es;q=0.9' -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' "$url")
            echo "RESULTADO curl: HTTP $code · $(wc -c < pagina.html) bytes · precios: $(grep -c optionPrices pagina.html) · reto de Cloudflare: $(grep -ci 'just a moment\|cf-chl' pagina.html) · $url"
          done
      - name: Lo mismo con Python, como el script del PC
        shell: bash
        run: |
          python3 - <<'EOF'
          import gzip, urllib.error, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          for url in ["https://www.hsnstore.com/marcas/raw-series/creatina-monohidrato-en-polvo-200-mesh",
                      "https://www.hsnstore.com/marcas/sport-series/evowhey-protein"]:
              cabeceras = {"User-Agent": UA, "Accept-Language": "es-ES,es;q=0.9", "Accept-Encoding": "gzip",
                           "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=cabeceras), timeout=40) as r:
                      datos = r.read()
                      if r.headers.get("Content-Encoding") == "gzip":
                          datos = gzip.decompress(datos)
                      texto = datos.decode("utf-8", "replace")
                      print(f"RESULTADO python: HTTP {r.status} · {len(texto)} caracteres · precios: {'optionPrices' in texto} · {url}")
              except urllib.error.HTTPError as e:
                  print(f"RESULTADO python: HTTP {e.code} · {url}")
              except Exception as e:
                  print(f"RESULTADO python: {e} · {url}")
          EOF
